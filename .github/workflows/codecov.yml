name: codecov
permissions:
  contents: read
  statuses: write
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      # scripts/lib/extract.js has its own isolated devDependency (a pinned
      # typescript@6.x, kept separate from root's own typescript@7.x — see
      # root AGENTS.md's TypeScript section) that the root `npm ci` above
      # doesn't install. This has to run BEFORE "Run tests and collect
      # coverage" below, not after: src/__tests__/docsInSync.test.ts (part
      # of that full suite) shells out to scripts/generate-*.js --check
      # itself, and without scripts/node_modules already present, Node
      # resolves `typescript` from root's own node_modules instead (7.x,
      # whose reduced API surface is missing ts.ScriptTarget/
      # createSourceFile). Same step ci.yml already has, for the same
      # reason.
      - name: Install scripts/ dependencies
        run: npm ci
        working-directory: scripts
      - name: Run tests and collect coverage
        run: npm run coverage:unit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: escape-llc/toolcrib