name: Deploy Demo to GitHub Pages

# Independent of ci.yml (tests on every push/PR) and release.yml (npm
# package releases on version tags) — this only builds and publishes the
# demo/ dev harness (demo/App.tsx + friends) as a static site, so anyone
# can see the toolkit working without cloning the repo. Runs on every push
# to main; a broken build here doesn't block ci.yml or release.yml, and
# vice versa.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment can run at a time; a second push while one is
# still building cancels the in-progress run rather than queuing behind it,
# so Pages always ends up serving the *latest* pushed commit, not
# whichever commit's deploy happened to finish last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # vite.config.ts's `base` only switches to '/toolcrib/' when Vite's
      # own `command` is 'build' (this step) — local `npm run dev` stays at
      # the domain root, unaffected. See that file's own comment.
      - name: Build demo
        run: npm run build

      # llms.txt/llms-full.txt (scripts/generate-docs.js, see AGENTS.md) are
      # committed at the repo root for pre-adoption discovery by an agent
      # browsing/cloning the repo -- that's a different audience than the
      # llmstxt.org convention this step exists for: a crawler fetching
      # https://<site>/llms.txt directly off a live site root, the same way
      # robots.txt/sitemap.xml work. `dist/` is that site root (see #290),
      # so copy both files in verbatim after the build produces it.
      # Known, deliberately accepted limitation: both files' internal links
      # are repo-relative (`./README.md`, `./ai-docs/CORE.md`, ...), correct
      # for GitHub's own rendering/raw-fetch of the committed files, but
      # `dist/` is a built SPA with no README.md/ai-docs/ of its own -- those
      # links won't resolve against the deployed copy. Rewriting them to
      # absolute GitHub blob URLs for a deploy-specific variant was
      # considered and deferred as a separate concern from placement itself.
      - name: Copy llms.txt/llms-full.txt to the built site root
        run: cp llms.txt llms-full.txt dist/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload build output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
