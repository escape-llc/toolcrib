name: E2E

# Deliberately a separate workflow from ci.yml, not an extra job in it — see
# e2e/README.md for why this suite exists at all (real-browser behavior
# jsdom, what ci.yml's Vitest run uses, structurally cannot verify:
# color-mix() resolution, :focus-visible input-device heuristics, genuine
# CSS animationend events). Keeping it separate means a flaky/slow browser
# install or a real e2e failure never blocks the fast unit-test signal
# ci.yml gives on every push, and either pipeline can be re-run
# independently of the other.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default — see ci.yml's identical comment. Uploading the
# Playwright report artifact doesn't need any elevated scope beyond this.
permissions:
  contents: read

jobs:
  e2e-shard:
    name: e2e shard (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # One job per browser, on separate runners -- previously a single job
    # ran chromium AND webkit sequentially against the same shared CPU
    # budget (one runner, both projects' Playwright workers competing for
    # the same cores). That wasn't just slower than it needed to be: this
    # suite's own WebKit-specific flakes (issue #413 -- a fixed
    # `waitForTimeout` sampling a real CSS transition too early, twice)
    # only ever showed up under real CI scheduling pressure, never
    # reproduced locally -- a shared runner running two browsers' full
    # suites at once is exactly the kind of contention that produces that
    # class of timing-sensitive failure. Splitting the matrix halves
    # wall-clock time AND gives WebKit -- the more resource-sensitive
    # engine of the two, per this file's own note in playwright.config.ts
    # -- a dedicated budget instead of a shared one.
    #
    # Each browser is also split into 3 shards (`--shard=N/3`, balanced by
    # test since the suite is fullyParallel). One WebKit job took 9-15
    # minutes, and a retry of a flaky leg meant waiting that long again.
    # Three shards run on three runners at once: roughly a third of the test
    # time per leg, plus a fixed install/build cost per shard.
    #
    # Branch protection requires `e2e (chromium)` and `e2e (webkit)`, so those
    # names are kept by the `e2e` job below, which passes only when every
    # shard of its own browser passed. Changing the `browser` values or the
    # shard count here means checking that job and, for a browser change,
    # branch protection.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Keyed on the OS, this matrix leg's own browser (chromium/webkit
      # binaries are cached independently -- no reason a webkit-only job
      # should ever restore/write a chromium download), and the exact
      # @playwright/test version actually installed (package-lock.json,
      # not package.json's own possibly-unpinned semver range) -- a
      # version bump invalidates the cache automatically rather than
      # silently running stale browser binaries against a newer test
      # runner. `~/.cache/ms-playwright` is the real download target
      # `playwright install` writes to; caching it turns a ~30-90s+ fresh
      # binary download into a cache restore on every run after the first
      # per (OS, browser, version) combination.
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      # Skipped only for a Dependabot-authored PR, never for a push to main
      # (the actor there is whoever performed the merge, not the original
      # PR author) -- release.yml's own pre-tag checklist already runs the
      # full suite before anything ships, so a routine dependency bump
      # doesn't need this repeated per-PR on top of that gate, but a real
      # regression still can't reach main without it. `test`/`cli-windows`
      # (both still required, both still run unconditionally) already
      # catch a broken test-runner-itself bump like vitest's own major
      # version -- confirmed directly, not assumed: PR #225 (vitest
      # 4->5) failed at `test` before `e2e` ever entered the picture.
      # e2e is still a required status check, so this skips the *steps*,
      # not the job -- a job with every step skipped still reports a real
      # completed (success) status, satisfying the required check, rather
      # than never posting one at all and permanently blocking merge.
      #
      # `--with-deps` still runs even on a cache hit -- it installs the
      # browser's real OS-level shared library dependencies (apt packages
      # on the runner image itself), which the cached path above never
      # covers and which a fresh runner image doesn't carry pre-installed.
      # Skipping it on a cache hit would risk a cached browser binary with
      # no matching system libs to actually launch it (a documented
      # Playwright caching gotcha, not something confirmed to have hit
      # this repo specifically) -- keeping the step unconditional avoids
      # relying on that risk never materializing.
      - name: Install Playwright browser (${{ matrix.browser }})
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run e2e suite (${{ matrix.browser }})
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # The check branch protection requires, one per browser: `e2e (chromium)` and
  # `e2e (webkit)`. A matrix job can't be required by its own shard names
  # without listing every shard, and a plain `needs` on the shard job would
  # make a WebKit failure turn the Chromium check red too, since `needs`
  # can't be filtered by matrix value. So this waits for all shards, then
  # reads this run's own jobs and judges only its browser's.
  e2e:
    name: e2e (${{ matrix.browser }})
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Require every ${{ matrix.browser }} shard to have passed
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ matrix.browser }}
        run: |
          jobs=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest" \
            --jq ".jobs[] | select(.name | startswith(\"e2e shard ($BROWSER \")) | \"\(.conclusion)\t\(.name)\"")
          echo "$jobs"
          expected=3
          found=$(echo "$jobs" | grep -c . || true)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected $BROWSER shards, found $found"
            exit 1
          fi
          if echo "$jobs" | grep -v '^success'; then
            echo "::error::a $BROWSER shard did not succeed"
            exit 1
          fi
