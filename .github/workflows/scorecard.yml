name: OpenSSF Scorecard supply-chain analysis

# A public, standardized supply-chain-hygiene signal -- complements this
# repo's existing CodeQL (vulnerability scanning) + Dependabot (dependency
# alerts) + toolcrib.zip's own SHA-256 checksum verification with a score
# (0-10) across ~18 checks neither of those cover: are third-party Actions
# pinned to a commit, not a mutable tag; does CI actually run on PRs; is
# branch protection on; does this repo have a security policy; etc. It
# finds posture gaps, not code vulnerabilities -- CodeQL still owns that.
# Base UI runs the same workflow (see .plans/toolcrib-gap-closure-plan.md
# §6a for the competitor-survey source of this item).
#
# Triggers: weekly on schedule (Scorecard grades ambient repo state, not a
# single commit, so re-running only on push would miss drift from
# something that isn't a code change at all -- e.g. branch protection
# getting toggled off in repo settings), on push to main (so a workflow
# change that regresses Pinned-Dependencies is caught immediately, matching
# this repo's own ci.yml trigger), and on branch_protection_rule (the
# official recommended trigger, so a protection-rule change is scored
# right away instead of waiting for the next scheduled run).
on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege at the workflow level (matches ci.yml/release.yml's own
# convention) -- the analysis job below grants back only what it actually
# needs, per the action's own documented requirements.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish results and get a badge.
      security-events: write
      # Needed for Branch-Protection check (uses the GitHub REST API).
      contents: read
      actions: read
      # Used to receive a badge via OIDC token -- see ossf/scorecard-action's
      # own docs for why this is required even though nothing here signs in.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Every third-party Action below is pinned to a full commit SHA, not
      # a mutable tag -- ironic to run a supply-chain scanner whose own
      # workflow fails its single most-cited check (Pinned-Dependencies).
      # Repo-wide re-pinning (every other workflow) followed shortly after
      # in #167, once the first real score flagged the gap.
      #
      # repo_token: the default GITHUB_TOKEN this job's own `permissions`
      # block grants can't read classic branch protection rules (a real,
      # confirmed error on this workflow's first run -- see issue #166),
      # so Branch-Protection needs a separate token with real read access.
      # TOOLCRIB_READ_TOKEN is a fine-grained PAT scoped to this repo only,
      # "Administration: Read-only" and nothing else, added as a repo
      # secret by the maintainer per ossf/scorecard-action's own auth docs
      # (https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md).
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.TOOLCRIB_READ_TOKEN }}
          publish_results: true

      - name: Upload SARIF results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Surfaces findings in the repo's own Security tab (Code scanning
      # alerts), alongside CodeQL's -- not just the public badge/API.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
