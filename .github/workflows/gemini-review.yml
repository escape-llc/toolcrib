name: Gemini Review

# Best-effort, reactive second-model review -- NOT a required status check,
# and nothing downstream waits for it. See issue #176 for the full design
# reasoning: a code review is a judgment call, not a checkable pass/fail
# floor (the same "guardrail vs. floor" distinction
# .plans/toolcrib-competitive-analysis.md draws), so gating merge on it is
# the wrong shape regardless of latency -- this repo already waits on real
# CI (e2e's ~6min is the long pole) before every merge, and a review almost
# always finishes inside that window anyway, but nothing here depends on
# that being true. It posts one PR comment when it finishes, whether that
# lands before or after merge -- a later checkpoint (a new session starting,
# or a periodic sweep) treats an unaddressed comment as a normal finding:
# file an issue, fix it via the standard issue -> branch -> PR cycle, same
# as any other review's output. If it lands after merge, that's fine -- run
# the workflow again against the follow-up.
#
# Deliberately simpler and more restricted than
# google-github-actions/run-gemini-cli's own official
# examples/workflows/pr-review + gemini-dispatch pair: those use a
# Docker-run github-mcp-server plus an unpinned third-party extension
# (github.com/gemini-cli-extensions/code-review) to give Gemini direct
# gh/GitHub-API tool-calling with real write scope (pull_request_review_write).
# This workflow gives Gemini exactly ONE tool -- "read_file", nothing else
# ("tools": {"core": ["read_file"]}, no mcpServers configured) -- and
# Gemini's only output is the review text itself, posted by a separate,
# code-controlled step using the workflow's own token. Gemini never acts on
# its own; the review is code-controlled data all the way to the PR comment.
#
# The diff is handed over as a FILE, not embedded as text in the prompt --
# real first-run feedback (this workflow's own first PR, #278) was "we
# generate pretty large diffs by design so allow for that": GitHub Actions
# publishes no documented size guarantee for $GITHUB_ENV specifically
# (unlike the 48KB/256KB limits that apply to configured repo/org Actions
# *variables*, a completely different mechanism), and this repo's own real
# PRs (a 76-file, 1166-insertion axe-testing sweep, e.g.) are exactly the
# shape that would stress it. Writing the diff to a file removes diff size
# as a constraint entirely. It's written INSIDE the checked-out workspace,
# not $RUNNER_TEMP -- a second real finding from that same first PR:
# GEMINI_CLI_TRUST_WORKSPACE scopes read_file access to the trusted
# workspace directory specifically, so a file outside it (an earlier
# version used $RUNNER_TEMP) silently failed to read at all. A useful
# confirmation, not just a bug: the sandbox is real and enforced, narrowing
# the residual risk below to "files already inside this public repo's own
# checkout," not the whole runner filesystem.
#
# Accepted residual risk, named directly rather than glossed over: a PR
# diff is untrusted input (this repo's own actions-injection-review skill
# exists for exactly this reason), and read_file is real tool access, not
# none -- a sufficiently adversarial diff could in principle prompt-inject
# Gemini into reading some OTHER file inside the checkout and echoing its
# content back into the review comment. The blast radius stays bounded even
# then, and more so now that the workspace sandbox is confirmed real:
# read_file cannot write, execute, or exfiltrate anything itself -- the
# worst case is a misleading comment quoting file content, which still has
# to sit there for a human/AI to evaluate before anyone acts on it, the
# same trust boundary as any other review comment. Judged acceptable given
# the job's own permissions carry nothing more sensitive than a
# pull-requests:write-scoped GITHUB_TOKEN and a review-only Gemini API key
# -- neither is a deploy/publish credential.
#
# Also reads the PR's own prior comment thread (a second read_file target,
# same zero-additional-tool treatment as the diff) so a later push
# (`synchronize`) doesn't repeat a finding a human/AI already resolved --
# real observed behavior from this exact PR, not hypothetical: an earlier
# run's false-positive claim got repeated verbatim on a later push with no
# memory of the refutation. See AGENTS.md's Gemini-breadcrumbs paragraph
# for the other half of this loop: whoever evaluates a finding should
# reply on the PR thread with the resolution, not just act on it silently,
# or the next automated run still has nothing to read.

on:
  pull_request:
    types: [opened, synchronize]

# Least-privilege: only what's needed to read the diff and post a comment.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Same-repo PRs only -- a fork's own diff is the least-trusted possible
    # input to hand an LLM; matches google-github-actions/run-gemini-cli's
    # own official dispatcher's identical `head.repo.fork == false` guard.
    # Dependabot PRs skipped too (same reasoning as ci.yml's existing
    # Dependabot carve-outs) -- a version-bump diff doesn't need a
    # code-quality second opinion the way a hand-written change does.
    if: |
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `gh pr diff` (GitHub's own API), not a manual `git diff
      # origin/<base>...HEAD` -- avoids depending on fetch-depth/remote-ref
      # gymnastics entirely. Written INSIDE the checked-out workspace, not
      # $RUNNER_TEMP -- a real finding from this exact workflow's own first
      # run of this design: GEMINI_CLI_TRUST_WORKSPACE scopes read_file
      # access to the trusted workspace directory specifically, and
      # $RUNNER_TEMP sits outside it, so the tool call silently failed
      # ("could not be read due to file access restrictions"). The leading
      # dot keeps it visually distinct as tool-generated, matching the
      # `.gemini/` gitignore convention already in this repo; it's never
      # committed, and the runner is discarded after the job either way.
      - name: Write the PR diff to a file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" > "${GITHUB_WORKSPACE}/.gemini-review-diff.txt"

      # `synchronize` (a new push to the same PR) re-runs this whole
      # workflow from scratch -- without this, each run has no memory of
      # what an earlier run already said, so a finding a human/AI already
      # evaluated and refuted (or already fixed) gets flagged again
      # verbatim on the next push. Real observed behavior, not
      # hypothetical: this exact workflow's own PR #278 had Gemini repeat
      # an already-refuted false-positive (a markdown-indentation claim,
      # verified wrong against the actual posted comment) on a later push.
      # `gh pr view --json comments` returns the same flat, chronological
      # issue-comment list `gh pr comment` posts into (both this workflow's
      # own past reviews and any human/AI reply addressing one) -- fetched
      # BEFORE this run's own Gemini step executes, so it never includes a
      # comment from the run currently in progress, only genuinely prior
      # ones. Empty on a PR's first run (`opened`, no comments yet) -- the
      # prompt below handles that case explicitly rather than assuming
      # history always exists.
      - name: Write prior PR review history to a file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" --json comments \
            --jq '.comments[] | "--- \(.author.login) (\(.createdAt)) ---\n\(.body)\n"' \
            > "${GITHUB_WORKSPACE}/.gemini-review-history.txt"

      - name: Run Gemini review (read_file only -- no shell, no write, no other tool)
        id: gemini_review
        # Never fails the job even if the API errors/times out/rate-limits --
        # this check is best-effort by design (see this file's own header
        # comment) and must never render as a red X, or it starts looking
        # like flaky required CI on every single PR.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ github.event.pull_request.number }}
          workflow_name: 'gemini-review'
          settings: |
            {
              "tools": { "core": ["read_file"] }
            }
          # A real, previous run of this exact workflow (PR #278) is the
          # source for two of these instructions: Gemini narrated wanting to
          # call a tool it didn't have ("I will run a command to check...")
          # before the "no tools, don't narrate" line was added; the
          # "read_file first" line is what replaced the earlier
          # embedded-diff-as-text design once the file-based handoff above
          # was added.
          prompt: |-
            You are reviewing a pull request diff for "toolcrib", a React component library vendored (not npm-installed) into consumer projects for AI-driven UI code generation.
            The full diff is in the file ${{ github.workspace }}/.gemini-review-diff.txt -- read it with your read_file tool first; that is the only tool available to you, and it is the only thing you need.
            Also read ${{ github.workspace }}/.gemini-review-history.txt -- the prior comment thread on this exact PR, including any of your own earlier reviews and any human or AI reply addressing one of your findings (confirming it, fixing it, or explaining why it's not a real issue). It may be empty if this is the first review on this PR.
            Do not repeat a finding from your own prior review unless the current diff still contains the exact issue AND no later comment in the history already addressed it. If a prior finding of yours was refuted, fixed, or marked not-applicable in a later comment, treat that as settled and do not raise it again -- trust the human/AI's resolution over your own earlier guess. Only raise a prior finding again if the current diff shows genuinely new evidence that changes the picture.
            Do not narrate an intent to run a command, search the repo, or check any other file; you cannot, and it isn't needed beyond the two files named above.
            Point out only real, specific defects: correctness bugs, accessibility regressions, security issues, or a clear violation of an established convention visible in the diff itself.
            Do not comment on style preferences, do not restate what the diff obviously does, and do not suggest changes outside what the diff actually touches.
            If you find nothing new worth flagging, say so in one short line -- do not invent a finding to have something to say, and do not restate an already-settled prior finding just to have content.
            Output ONLY the final review itself -- no reasoning, no plan, no description of what you are about to do. Keep the whole response under 400 words, plain text (no markdown headers).

      # Written to a file and posted via `--body-file`, not a `${{ }}`-
      # interpolated or inline-quoted --body string -- avoids the whole
      # class of shell-quoting/YAML-indentation fragility a multi-line,
      # LLM-generated string is otherwise exposed to (matches this repo's
      # own established `gh ... --body-file`/`-F body=@file` convention for
      # any multi-paragraph body). $REVIEW is LLM text generated from
      # untrusted diff content, so it's routed through `env:`, never
      # interpolated directly into a `run:` script via `${{ }}` -- that
      # would be exactly the script-injection shape this repo's own
      # actions-injection-review skill exists to catch.
      - name: Write the comment body to a file
        if: steps.gemini_review.outcome == 'success'
        env:
          REVIEW: ${{ steps.gemini_review.outputs.summary }}
        run: |
          {
            echo '🔎 **Gemini review** (best-effort, non-blocking -- see issue #176 for why this does not gate merge)'
            echo ''
            echo "$REVIEW"
          } > "${RUNNER_TEMP}/review-comment.md"

      - name: Post review as a PR comment (code-controlled, not Gemini-driven)
        if: steps.gemini_review.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "${RUNNER_TEMP}/review-comment.md"

      - name: Note a skipped/failed review without failing the job
        if: steps.gemini_review.outcome != 'success'
        run: echo "Gemini review did not complete successfully this run (outcome=${{ steps.gemini_review.outcome }}) -- no comment posted. Not failing the job; this check is best-effort by design."
