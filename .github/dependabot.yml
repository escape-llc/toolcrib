version: 2
updates:
  # Root package.json — the toolkit itself + the demo harness.
  #
  # react/react-dom (+ @types/react(-dom)) major-bump ignores that used to
  # live here are gone as of the v0.15.0 release cycle: this repo's own
  # dev/build/test toolchain was deliberately moved onto React 19 (see the
  # dependencies block's own react/react-dom entries) after a real
  # provisioning test confirmed it -- full suite green (113 files, 1344
  # tests), real consumer apps (feed-farmer-pwa, founders-desk) already run
  # React 19.2.8 in production with no issues. What PR #119's own closing
  # comment asked for ("not something to accept via an automated bump
  # without a deliberate decision") has now happened as that deliberate
  # decision, so the guard blocking it no longer serves a purpose.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # vitest + @vitest/coverage-v8 MUST move together regardless of
      # major/minor -- confirmed for real, not hypothetical: a Dependabot
      # PR bumping vitest to 5.0.0 alone (leaving @vitest/coverage-v8 at
      # 4.x) broke coverage provisioning outright. This group is matched
      # before minor-and-patch below (Dependabot evaluates groups in
      # order, first match wins), so a vitest-family major bump is pulled
      # in here instead of landing as two separate, independently-broken
      # PRs the way it just did.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types: ["minor", "patch"]

  # cli/ has its own independent package.json and lockfile (deliberately
  # isolated from root — see AGENTS.md's "cli/ has its own independent
  # package.json" section) and needs its own updates entry.
  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
    groups:
      # See root's identical vitest group above for why -- same package
      # pair, same isolated-package.json duplication of the risk.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types: ["minor", "patch"]

  # scripts/ also has its own independent package.json, pinned to
  # typescript@6.x for the Compiler API surface extract.js depends on
  # (see AGENTS.md's TypeScript section — bumping past 6.x removes
  # createSourceFile/ScriptTarget/etc. outright). Ignore major-version
  # bumps on that one dependency so Dependabot can't propose exactly the
  # upgrade AGENTS.md says not to make without first confirming the
  # classic Compiler API surface still exists.
  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # mcp/ (published separately as toolcrib-mcp) also has its own
  # independent package.json and lockfile — same isolation rationale as
  # cli/ above, and it ships zero vendored ai-docs content of its own, so
  # its dependency updates (@modelcontextprotocol/sdk, fuse.js, zod,
  # semver) are entirely unrelated to the toolkit's own release cadence.
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    groups:
      # See root's identical vitest group above for why.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Grouped the same way as the npm ecosystems above -- major bumps still
  # land as their own individual PR (Dependabot's default for anything a
  # group doesn't capture), since those are exactly the ones worth
  # reviewing in isolation rather than folded into a batch.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
