name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for softprops/action-gh-release to create the release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # scripts/lib/extract.js has its own isolated devDependency (a pinned
      # typescript@6.x, kept separate from root's own typescript version —
      # see root AGENTS.md's TypeScript section for why) that root's own
      # `npm ci` above doesn't install. Has to run BEFORE "Run toolkit test
      # suite" below, not after: src/__tests__/docsInSync.test.ts (part of
      # that suite) shells out to scripts/generate-*.js --check itself, and
      # without scripts/node_modules already present, Node resolves
      # `typescript` from root's own node_modules instead (7.x, whose
      # reduced API surface is missing ts.ScriptTarget/createSourceFile) —
      # a real ordering bug that broke every run of this exact job, not a
      # hypothetical.
      - name: Install scripts/ dependencies
        run: npm ci
        working-directory: scripts

      - name: Run toolkit test suite
        run: npm test

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Run CLI test suite
        run: npm test
        working-directory: cli

      # Fails the workflow (and blocks the release) if ai-docs/component-manifest.json
      # doesn't match what scripts/generate-manifest.js derives directly from
      # component source (JSDoc @manifest tags, prop types, slots, event bus
      # shape) — the same "don't trust hand-maintained metadata, recompute it"
      # principle as the peerDependency check below, applied to the manifest.
      - name: Check component-manifest.json matches source
        run: node scripts/generate-manifest.js --check

      # Fails the workflow (and blocks the release) if ai-docs/CORE.md
      # doesn't match what scripts/generate-docs.js renders from
      # ai-docs/templates/CORE.md.hbs + the same source-derived data as
      # the manifest check above (via scripts/lib/extract.js) — CORE.md's
      # Component Reference/Z-Index/Theme Slices/Event Bus sections are
      # generated, not hand-maintained, specifically because they drifted
      # silently before this existed (9 of 32 real event channels and 4 of
      # 20 real components were missing from the hand-written version).
      - name: Check ai-docs/CORE.md matches source
        run: node scripts/generate-docs.js --check

      # Fails the workflow (and blocks the release) if src/index.ts (the
      # public `#toolcrib` barrel) doesn't match what scripts/generate-index.js
      # derives from source — a file carries `@manifest` or `@barrelExport`,
      # it's re-exported, full stop. Exists because the hand-maintained
      # version drifted for real: an audit found Content, DataTableSlice,
      # and useSliceOverrides silently missing — each shipped to every
      # consumer as a vendored file, but unimportable via `#toolcrib`.
      - name: Check src/index.ts matches source
        run: node scripts/generate-index.js --check

      # Fails the workflow (and blocks the release) if the vendored
      # source imports a package package.json doesn't correctly declare
      # in "dependencies" — catches an AI-managed package.json drifting
      # out of sync with actual code (missing entries, or a runtime dep
      # left in devDependencies). See build-release.js's own checks.
      - name: Build core release contents
        run: node scripts/build-release.js

      - name: Package core zip + checksum
        run: node scripts/package-release.js

      # Optional artifact — install via `toolcrib init --with-tests`.
      # Built from the same package.json/version, so requiresToolkitVersion
      # in toolcrib-tests.config.json always matches this release by
      # construction, not by manual bookkeeping.
      - name: Build test-suite release contents
        run: node scripts/build-tests-release.js

      - name: Package test-suite zip + checksum
        run: node scripts/package-tests-release.js

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            toolcrib.zip
            toolcrib.zip.sha256
            toolcrib-tests.zip
            toolcrib-tests.zip.sha256
          generate_release_notes: true
