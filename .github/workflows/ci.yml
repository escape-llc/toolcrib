name: CI

# Runs on every push/PR to main — independent of release.yml, which only
# triggers on a pushed version tag. Before this existed, test failures and
# manifest/docs/index drift were only ever caught at release time, which
# could be days or releases apart from the change that introduced them.
# This intentionally does NOT build or publish anything — see release.yml
# for that, gated on tags as before.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only checks out the repo and runs
# tests — it never pushes, comments, or touches releases/Pages, so the
# default GITHUB_TOKEN would otherwise carry broader (e.g. write) scopes
# than it ever uses. Matches release.yml/deploy-demo.yml, which already
# scope theirs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Overrides the workflow-level contents:read-only default (see above)
    # -- this is the one job that reads code-scanning alerts (for the
    # security-advisories.json check below), which needs security-events:
    # read even on a public repo. Scoped to just this job, not workflow-
    # wide, matching the least-privilege precedent already established
    # for release.yml's contents:write (see AGENTS.md's OpenSSF Scorecard
    # hardening account).
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install toolkit dependencies
        run: npm ci

      # scripts/lib/extract.js has its own isolated devDependency (a pinned
      # typescript@6.x — see root AGENTS.md's TypeScript section) that
      # root's own npm ci above doesn't install. This has to run BEFORE
      # "Run toolkit test suite" below, not after: src/__tests__/
      # docsInSync.test.ts (part of that suite) shells out to
      # scripts/generate-*.js --check itself, and without scripts/
      # node_modules already present, Node resolves `typescript` from
      # root's own node_modules instead (7.x, whose reduced API surface is
      # missing ts.ScriptTarget/createSourceFile) — a real ordering bug
      # that broke every run of this exact job, not a hypothetical.
      - name: Install scripts/ dependencies
        run: npm ci
        working-directory: scripts

      - name: Run toolkit test suite
        run: npm test

      # eslint/typescript-eslint live in scripts/'s isolated node_modules
      # (already installed by "Install scripts/ dependencies" above), not
      # root's — see AGENTS.md's Linting section for why (typescript-eslint
      # hard-fails against root's TS 7.x, the same class of break as
      # extract.js's). Scoped to eslint-plugin-react-hooks's rules, plus a
      # local toolcrib-internal plugin (scripts/eslint-rules/theme-tokens.js)
      # catching the three self-inflicted anti-pattern shapes a real audit
      # of Toolcrib's own components against ai-docs/CORE.md's Anti-Patterns
      # section found live
      # — see .plans/toolcrib-gap-closure-plan.md §6b for the full account.
      # RuleTester unit tests for the vendored rules that carry real,
      # non-trivial detection logic (no-missing-use-client: 4 independent
      # detection categories plus scope-resolution logic, a false negative
      # silently ships a real build-breaking bug rather than a lint nit;
      # no-frozen-controlled-prop: scope-resolution + expression-chain
      # walking, a false negative silently ships a real runtime freeze bug
      # -- see eslint-rules/no-frozen-controlled-prop.js's own header for
      # the four real, live component bugs it was built from). Run before
      # Lint below, not after -- verify the rules themselves work before
      # trusting them to police the real corpus. Plain `node`, not Vitest:
      # root's own package.json has no `eslint` dependency at all
      # (deliberately isolated to scripts/), and ESLint's RuleTester needs
      # no test framework to function.
      - name: Test custom ESLint rules
        run: npm run test-eslint-rules

      - name: Lint (React hooks correctness + theme token usage)
        run: npm run lint

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Run CLI test suite
        run: npm test
        working-directory: cli

      # Same three checks src/__tests__/docsInSync.test.ts already runs as
      # part of "Run toolkit test suite" above (and that release.yml runs
      # before packaging) — kept here too as a second, narrower signal:
      # if only one of these three fails, the step name says exactly which
      # generated file drifted without needing to open the test suite's own
      # (more verbose, now much clearer) output first.
      - name: Check component-manifest.json (and its category split) matches source
        run: node scripts/generate-manifest.js --check

      - name: Check ai-docs/CORE.md and ai-docs/examples/ match source
        run: node scripts/generate-docs.js --check

      - name: Check src/index.ts matches source
        run: node scripts/generate-index.js --check

      # Unlike the three checks above, this one's "source" is live GitHub
      # API state (code-scanning alerts + releases), not local files -- see
      # scripts/generate-security-advisories.js's own header comment for
      # why. Needs security-events: read, granted below scoped to this job
      # only (least-privilege, matching the Token-Permissions hardening
      # elsewhere in this repo's workflows) -- the default GITHUB_TOKEN
      # already carries it once granted, no extra secret needed.
      - name: Check security-advisories.json matches real CodeQL alert state
        run: node scripts/generate-security-advisories.js --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every cross-platform bug found in this project's history so far (CRLF
  # vs LF, backslash path separators breaking `git apply`, a UTF-8 BOM
  # breaking JSON.parse — see AGENTS.md's Windows section) lived in cli/'s
  # path-handling code and was found only by someone running the CLI by
  # hand on a real Windows machine, because ubuntu-latest above cannot
  # reproduce any of it. Scoped to cli/'s own unit suite only (not a full
  # matrix of the job above) — cli/'s tests already mock process.platform
  # for both branches (see cli/test/zip.test.js, git.test.js), so this is a
  # cheap, low-risk addition, not a guess at what else might break on
  # Windows. It does NOT cover the real end-to-end case (a genuine git
  # apply against a real checked-out project, which is where the CRLF/BOM
  # bugs actually lived) -- see windows-integration below for that.
  cli-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Run CLI test suite
        run: npm test
        working-directory: cli

  # mcp/ had zero CI coverage of any kind before this job existed -- its own
  # test suite only ever ran when someone happened to run `cd mcp && npm
  # test` by hand. Found the hard way, not hypothetically: PR #280 added a
  # new numbered section to ai-docs/CORE.md, benignly renumbering every
  # heading after it -- exactly the "CORE.md's heading convention" trigger
  # AGENTS.md's own "mcp/'s parsing code has no automated check... check it
  # by hand whenever that shape changes" note already names -- and nothing
  # caught it. toolcrib-mcp@0.3.0 shipped warning for every real v0.14.0
  # consumer as a result, undetected until someone manually ran
  # mcp/integration-test/run.mjs weeks later. mcp/test/compatibility.test.js
  # now has a regression test computing the real fingerprint against this
  # repo's own actual ai-docs/ directly (not a fixture) -- this job is what
  # makes that test actually run automatically instead of only when someone
  # remembers to. Runs unconditionally on every PR, not path-filtered to
  # ai-docs/mcp changes specifically -- this repo has no existing
  # path-filtering convention anywhere in its workflows, and mcp/'s suite is
  # fast and fully offline (no network calls, matching cli-windows' own
  # unconditional-on-every-PR precedent), so scoping it narrower would add
  # real complexity for no measurable savings.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install toolcrib-mcp dependencies
        run: npm ci
        working-directory: mcp

      - name: Run toolcrib-mcp test suite
        run: npm test
        working-directory: mcp

  # A real Next.js App Router build -- catches two defect classes nothing
  # else in this workflow can see, because none of tsc/vitest/eslint
  # understand React Server Component boundaries at all: (1) a vendored
  # file missing 'use client' (see AGENTS.md's 'use client' section -- the
  # original 51-file fix undercounted at 51 of the real 79, found only by a
  # real build, twice), and (2) the documented SSR theme-injection pattern
  # (ai-docs/examples/ssr-theme-injection.md) actually failing to build the
  # way computeServerThemeCSS's original co-location with 'use client' did
  # (a file-level directive marks every export as client-only, including a
  # plain function meant to run on the server -- see
  # src/theme/serverThemeCSS.ts's own header comment). Reuses demo/App.tsx
  # as its page content instead of a second, separately-maintained demo --
  # see cli/integration-test/nextjs-fixture/README.md for why.
  nextjs-fixture:
    runs-on: ubuntu-latest
    # Skipped entirely for a Dependabot-authored PR -- not a required status
    # check (required contexts are test/cli-windows/e2e/CodeQL only,
    # confirmed via the branch protection API), so there's no "job must
    # still post a status" constraint the way e2e/screen-reader have. Same
    # reasoning as codecov.yml's run job.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install toolkit dependencies
        run: npm ci

      # See "Install scripts/ dependencies" above in the test job -- same
      # ordering requirement (scripts/lib/extract.js's isolated
      # typescript@6.x has to be installed before anything that shells out
      # to scripts/generate-*.js, which build-release.js does internally).
      - name: Install scripts/ dependencies
        run: npm ci
        working-directory: scripts

      - name: Build and package a real release
        run: |
          node scripts/build-release.js
          node scripts/package-release.js

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Stage the release for the mock GitHub server
        run: |
          mkdir -p cli/integration-test/releases
          cp toolcrib.zip toolcrib.zip.sha256 cli/integration-test/releases/

      - name: Start the mock GitHub server
        run: node cli/integration-test/mock-github-server.js &

      - name: Wait for the mock server to be ready
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9999/api/repos/escape-llc/toolcrib/releases/latest > /dev/null && exit 0
            sleep 1
          done
          echo "Mock GitHub server never became ready" >&2
          exit 1

      - name: Run the Next.js App Router smoke build
        run: node cli/integration-test/run-nextjs-fixture.mjs

  # The real end-to-end Windows integration test cli-windows above
  # explicitly doesn't cover: a real toolcrib init/apply/doctor pipeline,
  # via real `git apply`, on a real Windows host -- with a deliberately
  # BOM-prefixed package.json (PowerShell's `Out-File`/`>` redirection
  # adds one by default, so this is a realistic trigger, not a contrived
  # one). This is the exact shape of every historical Windows bug this
  # project has hit (see AGENTS.md's PowerShell-gotchas section), reusing
  # the same mock-GitHub-server infrastructure nextjs-fixture already
  # established. It found a real, previously-unknown bug the first time it
  # ran: readTextIfExists() used to strip a BOM before handing that text
  # to PendingChanges.propose() as a patch's "before" content, but `git
  # apply` matches a patch's context against the real bytes on disk (BOM
  # included) -- so a BOM'd package.json always failed to apply, silently
  # discarded. See cli/src/lib/project.js's readTextIfExists and
  # cli/integration-test/run-windows-integration.mjs for the full account.
  windows-integration:
    runs-on: windows-latest
    # Same reasoning as nextjs-fixture above -- not a required status check,
    # skipped entirely (not just its steps) for a Dependabot-authored PR.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install toolkit dependencies
        run: npm ci

      - name: Build and package a real release
        run: |
          node scripts/build-release.js
          node scripts/package-release.js

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      # bash steps below (Git Bash, bundled on GitHub's windows-latest
      # runners) reuse the exact same commands as nextjs-fixture's
      # Linux job, rather than rewriting them in PowerShell syntax.
      - name: Stage the release for the mock GitHub server
        shell: bash
        run: |
          mkdir -p cli/integration-test/releases
          cp toolcrib.zip toolcrib.zip.sha256 cli/integration-test/releases/

      - name: Start the mock GitHub server
        shell: bash
        run: node cli/integration-test/mock-github-server.js &

      - name: Wait for the mock server to be ready
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9999/api/repos/escape-llc/toolcrib/releases/latest > /dev/null && exit 0
            sleep 1
          done
          echo "Mock GitHub server never became ready" >&2
          exit 1

      - name: Run the real Windows init/apply/doctor integration test
        shell: bash
        run: node cli/integration-test/run-windows-integration.mjs

  # WORKFLOW.md documented this as a real gap: no YAML linter was wired in
  # anywhere, only an ad-hoc "run npx js-yaml before pushing" manual
  # practice. actionlint (rhysd/actionlint) is the purpose-built tool --
  # unlike js-yaml (bare YAML syntax only), it understands actual GitHub
  # Actions semantics (job structure, expression syntax, known action
  # inputs, permissions typos), and on ubuntu-latest it also gets
  # shellcheck integration for free (preinstalled on GitHub-hosted
  # runners), checking every `run:` block's shell syntax too. Verified
  # directly before adding this: a real run against every workflow file in
  # this repo found zero findings -- purely additive, no cleanup debt.
  # Runs via the official binary's npm/npx wrapper (github-actionlint,
  # version-pinned) rather than a separate GitHub Action -- no repo
  # checkout dependency beyond the workflow files themselves, no new
  # third-party Action to trust/pin.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Lint GitHub Actions workflow files
        run: npx --yes github-actionlint@1.7.12

  # A second real gap, found the same way: this repo's docs cross-reference
  # dozens of real GitHub issues/PRs/discussions/commits by URL, with
  # nothing catching a typo'd number or a link that rotted after a rename.
  # Verified directly before adding this: a real lychee run against every
  # .md/.txt file in the repo found the links healthy -- npmjs.com and
  # badge.fury.io both return 403 to automated (non-browser) requests, a
  # known bot-blocking quirk of badge-hosting sites, not real dead links
  # (both were confirmed working normally in a real browser) -- excluded
  # below rather than accepted as a passing status code, which would be
  # broader than needed and could mask a genuinely gated page elsewhere.
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --exclude 'npmjs\.com' --exclude 'badge\.fury\.io' './**/*.md' './**/*.txt'
          fail: true
