name: CI

# Runs on every push/PR to main — independent of release.yml, which only
# triggers on a pushed version tag. Before this existed, test failures and
# manifest/docs/index drift were only ever caught at release time, which
# could be days or releases apart from the change that introduced them.
# This intentionally does NOT build or publish anything — see release.yml
# for that, gated on tags as before.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only checks out the repo and runs
# tests — it never pushes, comments, or touches releases/Pages, so the
# default GITHUB_TOKEN would otherwise carry broader (e.g. write) scopes
# than it ever uses. Matches release.yml/deploy-demo.yml, which already
# scope theirs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install toolkit dependencies
        run: npm ci

      # scripts/lib/extract.js has its own isolated devDependency (a pinned
      # typescript@6.x — see root AGENTS.md's TypeScript section) that
      # root's own npm ci above doesn't install. This has to run BEFORE
      # "Run toolkit test suite" below, not after: src/__tests__/
      # docsInSync.test.ts (part of that suite) shells out to
      # scripts/generate-*.js --check itself, and without scripts/
      # node_modules already present, Node resolves `typescript` from
      # root's own node_modules instead (7.x, whose reduced API surface is
      # missing ts.ScriptTarget/createSourceFile) — a real ordering bug
      # that broke every run of this exact job, not a hypothetical.
      - name: Install scripts/ dependencies
        run: npm ci
        working-directory: scripts

      - name: Run toolkit test suite
        run: npm test

      # eslint/typescript-eslint live in scripts/'s isolated node_modules
      # (already installed by "Install scripts/ dependencies" above), not
      # root's — see AGENTS.md's Linting section for why (typescript-eslint
      # hard-fails against root's TS 7.x, the same class of break as
      # extract.js's). Scoped to just eslint-plugin-react-hooks's rules.
      - name: Lint (React hooks correctness)
        run: npm run lint

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Run CLI test suite
        run: npm test
        working-directory: cli

      # Same three checks src/__tests__/docsInSync.test.ts already runs as
      # part of "Run toolkit test suite" above (and that release.yml runs
      # before packaging) — kept here too as a second, narrower signal:
      # if only one of these three fails, the step name says exactly which
      # generated file drifted without needing to open the test suite's own
      # (more verbose, now much clearer) output first.
      - name: Check component-manifest.json (and its category split) matches source
        run: node scripts/generate-manifest.js --check

      - name: Check ai-docs/CORE.md and ai-docs/examples/ match source
        run: node scripts/generate-docs.js --check

      - name: Check src/index.ts matches source
        run: node scripts/generate-index.js --check

  # Every cross-platform bug found in this project's history so far (CRLF
  # vs LF, backslash path separators breaking `git apply`, a UTF-8 BOM
  # breaking JSON.parse — see AGENTS.md's Windows section) lived in cli/'s
  # path-handling code and was found only by someone running the CLI by
  # hand on a real Windows machine, because ubuntu-latest above cannot
  # reproduce any of it. Scoped to cli/'s own unit suite only (not a full
  # matrix of the job above) — cli/'s tests already mock process.platform
  # for both branches (see cli/test/zip.test.js, git.test.js), so this is a
  # cheap, low-risk addition, not a guess at what else might break on
  # Windows. It does NOT yet cover the real end-to-end case (a genuine git
  # apply against a real checked-out project, which is where the CRLF/BOM
  # bugs actually lived) -- that only exists today as a manual, multi-step
  # procedure documented in cli/CONTRIBUTING.md's integration-test section.
  # Automating that on Windows CI too is real, separate follow-up work
  # (tracked in .plans/toolcrib-defect-pindown-plan.md), not something this
  # job already closes.
  cli-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Run CLI test suite
        run: npm test
        working-directory: cli
